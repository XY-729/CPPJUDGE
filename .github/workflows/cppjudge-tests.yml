name: CPPJUDGE Tests

on:
  push:
    branches:
      - master
      - main
      - stage2-testing
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cppjudge-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-tests:
    name: Portable tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CPPJUDGE_TEST_BUILD_DIR: ${{ github.workspace }}/build-ci
      CPPJUDGE_TEST_JOBS: "2"
      CPPJUDGE_TEST_REPEAT: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            python3

      - name: Validate test runner syntax
        run: |
          set -euo pipefail
          bash -n scripts/run_all_tests.sh

      - name: Prepare build compatibility symlink
        run: ln -s build-ci build

      - name: Run portable test profile
        run: |
          set -euo pipefail
          bash scripts/run_all_tests.sh portable

      - name: Upload CTest failure logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ctest-failure-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build-ci/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7
